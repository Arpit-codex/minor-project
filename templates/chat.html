
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Chat — Contextual Memory</title>
    <meta name="description" content="Local Memory-Based AI Chat with Independent Memory and Retrieval Modes">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ═══════════════ DESIGN SYSTEM ═══════════════ */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-card: #1c2128;
            --bg-hover: #292e36;
            --border: #30363d;
            --border-active: #58a6ff;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --danger: #f85149;
            --success: #56d364;
            --purple: #7C6FE0;
            --teal: #4ECDC4;
            --coral: #FF6B6B;
            --amber: #f0883e;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-deep: 0 16px 48px rgba(0, 0, 0, 0.6);
            --shadow-medium: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .chat-app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--purple), var(--accent));
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .sidebar-actions {
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .btn-new-chat {
            width: 100%;
            padding: 9px 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-new-chat:hover {
            background: #79b8ff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .conversations-list::-webkit-scrollbar {
            width: 5px;
        }
        .conversations-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .conv-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: var(--transition);
            border: 1px solid transparent;
            position: relative;
        }

        .conv-item:hover {
            background: var(--bg-tertiary);
        }

        .conv-item.active {
            background: var(--bg-card);
            border-color: var(--border-active);
        }

        .conv-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .conv-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .btn-delete-conv {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .conv-item:hover .btn-delete-conv {
            opacity: 1;
        }

        .btn-delete-conv:hover {
            color: var(--danger);
            background: rgba(248, 81, 73, 0.15);
        }

        .conv-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        .mode-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 10px;
            letter-spacing: 0.05em;
        }

        .mode-badge.normal {
            background: rgba(139, 148, 158, 0.18);
            color: #8b949e;
        }
        .mode-badge.memory {
            background: rgba(86, 211, 100, 0.18);
            color: #56d364;
        }
        .mode-badge.retrieval {
            background: rgba(69, 183, 209, 0.18);
            color: #45B7D1;
        }
        .mode-badge.both {
            background: rgba(124, 111, 224, 0.22);
            color: #9d92ee;
        }

        .sidebar-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ─── MAIN CHAT AREA ─── */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* Top Bar */
        .chat-header {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            z-index: 5;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
        }

        .chat-title-editable {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .chat-title-editable:hover {
            border-color: var(--border);
            background: var(--bg-tertiary);
        }

        .chat-title-editable:focus {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        /* Mode Selector Tabs */
        .mode-selector {
            display: flex;
            align-items: center;
            background: var(--bg-tertiary);
            padding: 3px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            gap: 2px;
        }

        .mode-btn {
            padding: 5px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .mode-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .mode-btn.active {
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .mode-btn.active[data-mode="normal"] { color: #8b949e; border-bottom: 2px solid #8b949e; }
        .mode-btn.active[data-mode="memory"] { color: #56d364; border-bottom: 2px solid #56d364; }
        .mode-btn.active[data-mode="retrieval"] { color: #45B7D1; border-bottom: 2px solid #45B7D1; }
        .mode-btn.active[data-mode="both"] { color: #9d92ee; border-bottom: 2px solid #7C6FE0; }

        .capabilities-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .cap-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 7px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .cap-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .cap-dot.on { background: var(--success); box-shadow: 0 0 6px rgba(86, 211, 100, 0.5); }
        .cap-dot.off { background: var(--text-muted); opacity: 0.5; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .provider-badge {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 4px 9px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* ─── MESSAGES CONTAINER ─── */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Empty State */
        .empty-state {
            max-width: 680px;
            margin: auto;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .mode-cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            text-align: left;
        }

        .mode-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .mode-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            background: var(--bg-card);
        }

        .mode-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .mode-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Message Rows */
        .message-row {
            display: flex;
            gap: 14px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.25s ease;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message-row.user .avatar {
            background: linear-gradient(135deg, #1f6feb, #388bfd);
            color: #fff;
            order: 2;
        }

        .message-row.assistant .avatar {
            background: linear-gradient(135deg, var(--purple), var(--accent));
            color: #fff;
        }

        .message-content-wrapper {
            max-width: calc(100% - 50px);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message-row.user .message-content-wrapper {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }

        .message-row.user .message-bubble {
            background: #1f6feb;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message-row.assistant .message-bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
            width: 100%;
        }

        /* Markdown styling within assistant bubbles */
        .message-bubble p { margin-bottom: 10px; }
        .message-bubble p:last-child { margin-bottom: 0; }
        .message-bubble ul, .message-bubble ol { margin-left: 20px; margin-bottom: 10px; }
        .message-bubble li { margin-bottom: 4px; }
        .message-bubble h1, .message-bubble h2, .message-bubble h3 { margin: 12px 0 8px 0; font-weight: 600; }
        .message-bubble h1 { font-size: 18px; }
        .message-bubble h2 { font-size: 16px; }
        .message-bubble h3 { font-size: 14px; }
        .message-bubble hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
        .message-bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
        .message-bubble th, .message-bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
        .message-bubble th { background: var(--bg-tertiary); }
        .message-bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 10px 0; }
        .message-bubble pre {
            background: #090d13;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            position: relative;
        }
        .message-bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
        }
        .message-bubble :not(pre) > code {
            background: var(--bg-tertiary);
            padding: 2px 5px;
            border-radius: 4px;
            color: #79c0ff;
        }

        /* Code block copy button */
        .code-copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 3px 8px;
            font-size: 11px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .code-copy-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        /* Memory Snippets inside assistant messages */
        .retrieved-memories-card {
            background: rgba(69, 183, 209, 0.08);
            border: 1px solid rgba(69, 183, 209, 0.25);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .retrieved-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #45B7D1;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .retrieved-list {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .retrieved-item {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11.5px;
            line-height: 1.4;
        }

        .retrieved-item-title {
            font-weight: 600;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-tag {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 5px;
            border-radius: 4px;
        }

        /* Learned Memory alert */
        .learned-memory-card {
            background: rgba(86, 211, 100, 0.08);
            border: 1px solid rgba(86, 211, 100, 0.25);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            margin-top: 8px;
            font-size: 11.5px;
            color: #56d364;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .btn-copy-msg {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-copy-msg:hover {
            color: var(--text-primary);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: fit-content;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ─── BOTTOM INPUT BAR ─── */
        .chat-input-wrapper {
            padding: 16px 32px 24px;
            background: linear-gradient(180deg, transparent, var(--bg-primary) 20%);
        }

        .input-container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-medium);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: var(--transition);
        }

        .input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .chat-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 180px;
            line-height: 1.5;
        }

        .chat-textarea::placeholder {
            color: var(--text-muted);
        }

        .input-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-hints {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-send {
            padding: 7px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-send:hover:not(:disabled) {
            background: #79b8ff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast container */
        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .toast {
            padding: 9px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            box-shadow: var(--shadow-medium);
            animation: fadeIn 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <!-- ══════ SIDEBAR ══════ -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/chat" class="brand">
                    <span class="brand-logo">💬</span>
                    <span class="brand-title">AI Chat</span>
                </a>
                <div style="display:flex; align-items:center; gap:6px;">
                    <a href="/memory-graph" class="nav-btn" title="View Obsidian Force Graph">
                        <span>◈</span> Graph
                    </a>
                    <a href="/efficiency" class="nav-btn" title="Token & Efficiency Optimizer">
                        <span>⚡</span> Opt
                    </a>
                </div>
            </div>

            <div class="sidebar-actions">
                <button class="btn-new-chat" id="btn-new-chat" onclick="startNewConversation()">
                    <span>＋</span> New Chat
                </button>
                <div class="search-box">
                    <input type="text" id="conv-search-input" placeholder="Search past chats..." oninput="filterConversations()" />
                </div>
            </div>

            <div class="conversations-list" id="conversations-list">
                <!-- Dynamically populated -->
            </div>

            <div class="sidebar-footer">
                <span id="conv-count-text">0 conversations</span>
                <span id="active-provider-label">Provider: freellmapi</span>
            </div>
        </aside>

        <!-- ══════ MAIN CHAT ══════ -->
        <main class="chat-main">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <span id="chat-title" class="chat-title-editable" contenteditable="true" onblur="saveConversationTitle()" title="Click to rename">
                        New Conversation
                    </span>
                </div>

                <!-- 4 Modes Selector -->
                <div class="mode-selector" id="mode-selector">
                    <button class="mode-btn" data-mode="normal" onclick="setMode('normal')" title="No memory operations — ultra-fast direct chat">
                        ⚡ Normal
                    </button>
                    <button class="mode-btn" data-mode="memory" onclick="setMode('memory')" title="Learns & saves your facts into memory without retrieval">
                        📝 Memory
                    </button>
                    <button class="mode-btn" data-mode="retrieval" onclick="setMode('retrieval')" title="Retrieves existing memories to answer questions">
                        🔍 Retrieval
                    </button>
                    <button class="mode-btn active" data-mode="both" onclick="setMode('both')" title="Full contextual assistant: retrieves memories & learns updates">
                        ✨ Both
                    </button>
                </div>

                <!-- Capabilities Badges -->
                <div class="capabilities-indicator">
                    <div class="cap-pill" title="Memory Writing capability">
                        <span class="cap-dot on" id="cap-write-dot"></span>
                        <span>Write</span>
                    </div>
                    <div class="cap-pill" title="Memory Retrieval capability">
                        <span class="cap-dot on" id="cap-retrieval-dot"></span>
                        <span>Recall</span>
                    </div>
                </div>

                <div class="header-right">
                    <div class="provider-badge" id="provider-badge">
                        <span>🤖</span>
                        <select id="model-select" style="background:var(--bg-tertiary); border:none; color:var(--text-primary); font-family:inherit; font-size:12px; font-weight:600; outline:none; cursor:pointer; padding:2px 4px; border-radius:4px;">
                            <option value="gemini-3.1-flash-lite" selected>gemini-3.1-flash-lite ⚡ (1.4s)</option>
                            <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (1.9s)</option>
                            <option value="gemini-flash-lite">gemini-flash-lite (2.0s)</option>
                            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
                            <option value="auto">auto router</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- Messages Area -->
            <div class="messages-container" id="messages-container">
                <!-- Populated dynamically or shows Empty State -->
            </div>

            <!-- Input Bar -->
            <div class="chat-input-wrapper">
                <div class="input-container">
                    <textarea 
                        id="chat-textarea" 
                        class="chat-textarea" 
                        placeholder="Type a message... (Shift+Enter for new line)"
                        rows="1"
                        oninput="autoResizeTextarea(this)"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <div class="input-controls">
                        <div class="input-hints">
                            <span id="mode-hint">✨ Both: Reads & updates memory</span>
                            <span>•</span>
                            <span>Enter to send</span>
                        </div>
                        <button class="btn-send" id="btn-send" onclick="sendMessage()">
                            <span>Send</span> ➤
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // ═══════════════ STATE MANAGEMENT ═══════════════
        let currentConversationId = null;
        let currentMode = "both";
        let conversations = [];
        let isGenerating = false;

        const MODE_DESCRIPTIONS = {
            "normal": "⚡ Normal: Ultra-fast chat with current session context only. No memory files read or saved.",
            "memory": "📝 Memory: Learns facts and saves them to your local memory in the background. No retrieval.",
            "retrieval": "🔍 Retrieval: Recalls your verified local memories to answer personal questions.",
            "both": "✨ Both: Reads existing memories and continuously updates knowledge."
        };

        // ═══════════════ INITIALIZATION ═══════════════
        document.addEventListener("DOMContentLoaded", async () => {
            await fetchConfig();
            await loadConversations();

            // Check for pre-filled prompt from the Efficiency Optimizer
            const prefill = sessionStorage.getItem("ai_assistant_prefill_prompt");
            if (prefill) {
                const textarea = document.getElementById("chat-textarea");
                if (textarea) {
                    textarea.value = prefill;
                    autoResizeTextarea(textarea);
                    textarea.focus();
                }
                sessionStorage.removeItem("ai_assistant_prefill_prompt");
            }
        });

        async function fetchConfig() {
            try {
                const res = await fetch("/api/config");
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("active-provider-label").innerText = `Provider: ${data.active_provider}`;
                    const modelSel = document.getElementById("model-select");
                    if (modelSel && data.active_model) {
                        modelSel.value = data.active_model;
                    }
                }
            } catch (err) {
                console.warn("Config load error:", err);
            }
        }

        async function loadConversations() {
            try {
                const res = await fetch("/api/conversations");
                if (res.ok) {
                    conversations = await res.json();
                    renderConversationsList();
                    if (conversations.length > 0) {
                        selectConversation(conversations[0].id);
                    } else {
                        startNewConversation();
                    }
                }
            } catch (err) {
                console.error("Failed to load conversations:", err);
            }
        }

        function renderConversationsList(filter = "") {
            const listEl = document.getElementById("conversations-list");
            listEl.innerHTML = "";
            const filtered = filter 
                ? conversations.filter(c => c.title.toLowerCase().includes(filter.toLowerCase()))
                : conversations;

            document.getElementById("conv-count-text").innerText = `${filtered.length} conversation${filtered.length === 1 ? '' : 's'}`;

            filtered.forEach(c => {
                const item = document.createElement("div");
                item.className = `conv-item ${c.id === currentConversationId ? 'active' : ''}`;
                item.onclick = (e) => {
                    if (e.target.closest('.btn-delete-conv')) return;
                    selectConversation(c.id);
                };

                const modeTag = c.mode || 'both';
                const count = c.message_count || 0;

                item.innerHTML = `
                    <div class="conv-title-row">
                        <span class="conv-title" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</span>
                        <button class="btn-delete-conv" title="Delete conversation" onclick="deleteConversation('${c.id}')">✕</button>
                    </div>
                    <div class="conv-meta">
                        <span class="mode-badge ${modeTag}">${modeTag}</span>
                        <span>${count} msg${count === 1 ? '' : 's'}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function filterConversations() {
            const term = document.getElementById("conv-search-input").value;
            renderConversationsList(term);
        }

        // ═══════════════ CONVERSATION ACTIONS ═══════════════
        async function startNewConversation(mode = currentMode) {
            try {
                const res = await fetch("/api/conversations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title: "New Conversation", mode: mode })
                });
                if (res.ok) {
                    const newConv = await res.json();
                    conversations.unshift(newConv);
                    renderConversationsList();
                    selectConversation(newConv.id);
                }
            } catch (err) {
                showToast("Failed to create conversation: " + err);
            }
        }

        async function selectConversation(convId) {
            currentConversationId = convId;
            renderConversationsList();

            try {
                const res = await fetch(`/api/conversations/${convId}`);
                if (res.ok) {
                    const data = await res.json();
                    const conv = data.conversation;
                    document.getElementById("chat-title").innerText = conv.title || "New Conversation";
                    
                    // Restore saved mode
                    setMode(conv.mode || "both", false);

                    // Render messages
                    renderMessages(data.messages || []);
                }
            } catch (err) {
                showToast("Failed to load conversation: " + err);
            }
        }

        async function saveConversationTitle() {
            if (!currentConversationId) return;
            const titleEl = document.getElementById("chat-title");
            const newTitle = titleEl.innerText.trim();
            if (!newTitle) return;

            try {
                await fetch(`/api/conversations/${currentConversationId}/title`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title: newTitle })
                });
                const c = conversations.find(x => x.id === currentConversationId);
                if (c) c.title = newTitle;
                renderConversationsList();
            } catch (err) {
                console.error("Failed to update title:", err);
            }
        }

        async function deleteConversation(convId) {
            if (!confirm("Are you sure you want to delete this conversation?")) return;
            try {
                const res = await fetch(`/api/conversations/${convId}`, { method: "DELETE" });
                if (res.ok) {
                    conversations = conversations.filter(c => c.id !== convId);
                    if (currentConversationId === convId) {
                        if (conversations.length > 0) {
                            selectConversation(conversations[0].id);
                        } else {
                            startNewConversation();
                        }
                    } else {
                        renderConversationsList();
                    }
                    showToast("Conversation deleted");
                }
            } catch (err) {
                showToast("Failed to delete conversation");
            }
        }

        // ═══════════════ MODE SELECTION ═══════════════
        async function setMode(mode, persist = true) {
            currentMode = mode;

            // Update mode selector buttons
            document.querySelectorAll(".mode-btn").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.mode === mode);
            });

            // Update capability dots
            const isWrite = (mode === "memory" || mode === "both");
            const isRetrieval = (mode === "retrieval" || mode === "both");

            const writeDot = document.getElementById("cap-write-dot");
            const retDot = document.getElementById("cap-retrieval-dot");

            writeDot.className = `cap-dot ${isWrite ? 'on' : 'off'}`;
            retDot.className = `cap-dot ${isRetrieval ? 'on' : 'off'}`;

            // Update mode hint
            document.getElementById("mode-hint").innerText = MODE_DESCRIPTIONS[mode] || "";

            // Persist with conversation if active
            if (persist && currentConversationId) {
                try {
                    await fetch(`/api/conversations/${currentConversationId}/mode`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ mode: mode })
                    });
                    const c = conversations.find(x => x.id === currentConversationId);
                    if (c) c.mode = mode;
                    renderConversationsList();
                } catch (err) {
                    console.error("Failed to persist mode:", err);
                }
            }
        }

        // ═══════════════ MESSAGE RENDERING ═══════════════
        function renderMessages(messages) {
            const container = document.getElementById("messages-container");
            container.innerHTML = "";

            if (!messages || messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Personal AI Assistant</h2>
                        <p>Welcome! Choose your operating mode to control memory access and learning.</p>
                        <div class="mode-cards-grid">
                            <div class="mode-card" onclick="setMode('normal')">
                                <div class="mode-card-header" style="color:#8b949e">⚡ Normal Chat</div>
                                <div class="mode-card-desc">Fastest response. Directly answers with session context only without memory storage or lookup.</div>
                            </div>
                            <div class="mode-card" onclick="setMode('memory')">
                                <div class="mode-card-header" style="color:#56d364">📝 Memory Chat</div>
                                <div class="mode-card-desc">Automatically classifies and saves new personal facts into long-term storage in the background.</div>
                            </div>
                            <div class="mode-card" onclick="setMode('retrieval')">
                                <div class="mode-card-header" style="color:#45B7D1">🔍 Retrieval Chat</div>
                                <div class="mode-card-desc">Recalls previously stored notes and memories to give personalized answers.</div>
                            </div>
                            <div class="mode-card" onclick="setMode('both')">
                                <div class="mode-card-header" style="color:#9d92ee">✨ Combined (Both)</div>
                                <div class="mode-card-desc">Both reads existing memories and updates facts continuously.</div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            messages.forEach(msg => {
                appendMessageToUI(msg.role, msg.content, msg.timestamp, null, null);
            });
            scrollToBottom();
        }

        function appendMessageToUI(role, content, timestamp, retrievedMemories = null, extractedMemory = null) {
            const container = document.getElementById("messages-container");
            const emptyState = container.querySelector(".empty-state");
            if (emptyState) emptyState.remove();

            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const avatarIcon = role === "user" ? "👤" : "◈";
            const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            let htmlContent = "";
            if (role === "assistant") {
                // If retrieved memories exist, add collapsible card
                let memHtml = "";
                if (retrievedMemories && retrievedMemories.length > 0) {
                    const items = retrievedMemories.map(m => `
                        <div class="retrieved-item">
                            <div class="retrieved-item-title">
                                <span class="cat-tag" style="background:${m.color}25; color:${m.color}">${escapeHtml(m.category)}</span>
                                <span>${escapeHtml(m.title)}</span>
                            </div>
                            <div style="color:var(--text-secondary);">${escapeHtml(m.content.slice(0, 160))}${m.content.length > 160 ? '...' : ''}</div>
                        </div>
                    `).join("");

                    memHtml = `
                        <div class="retrieved-memories-card">
                            <div class="retrieved-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'flex' : 'none'">
                                <span>🔍 Recalled ${retrievedMemories.length} relevant memor${retrievedMemories.length === 1 ? 'y' : 'ies'}</span>
                                <span style="font-size:10px;">▾</span>
                            </div>
                            <div class="retrieved-list">
                                ${items}
                            </div>
                        </div>
                    `;
                }

                // If memory was extracted
                let extractedHtml = "";
                if (extractedMemory) {
                    extractedHtml = `
                        <div class="learned-memory-card">
                            <span>💡 Automatically learned:</span>
                            <strong>${escapeHtml(extractedMemory.title)}</strong>
                            <span>in [${escapeHtml(extractedMemory.category)}]</span>
                        </div>
                    `;
                }

                const parsedMarkdown = marked.parse(content);
                htmlContent = `
                    <div class="avatar">${avatarIcon}</div>
                    <div class="message-content-wrapper">
                        ${memHtml}
                        <div class="message-bubble">${parsedMarkdown}</div>
                        ${extractedHtml}
                        <div class="message-footer">
                            <span>${timeStr}</span>
                            <button class="btn-copy-msg" onclick="copyMessageText(this, '${escapeForAttribute(content)}')">Copy</button>
                        </div>
                    </div>
                `;
            } else {
                htmlContent = `
                    <div class="avatar">${avatarIcon}</div>
                    <div class="message-content-wrapper">
                        <div class="message-bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                        <div class="message-footer">
                            <span>${timeStr}</span>
                        </div>
                    </div>
                `;
            }

            row.innerHTML = htmlContent;
            container.appendChild(row);

            // Setup code highlighting and copy buttons
            if (role === "assistant") {
                row.querySelectorAll("pre code").forEach((block) => {
                    hljs.highlightElement(block);
                    const pre = block.parentElement;
                    if (!pre.querySelector(".code-copy-btn")) {
                        const copyBtn = document.createElement("button");
                        copyBtn.className = "code-copy-btn";
                        copyBtn.innerText = "Copy";
                        copyBtn.onclick = () => {
                            navigator.clipboard.writeText(block.innerText);
                            copyBtn.innerText = "Copied!";
                            setTimeout(() => copyBtn.innerText = "Copy", 2000);
                        };
                        pre.appendChild(copyBtn);
                    }
                });
            }

            scrollToBottom();
        }

        // ═══════════════ SEND MESSAGE ═══════════════
        async function sendMessage() {
            if (isGenerating) return;
            const textarea = document.getElementById("chat-textarea");
            const text = textarea.value.trim();
            if (!text) return;

            // Clear textarea
            textarea.value = "";
            textarea.style.height = "auto";

            // If no active conversation, create one
            if (!currentConversationId) {
                await startNewConversation();
            }

            // Append user message
            appendMessageToUI("user", text, new Date().toISOString());

            // Show typing indicator
            isGenerating = true;
            document.getElementById("btn-send").disabled = true;
            showTypingIndicator();

            try {
                const modelSel = document.getElementById("model-select");
                const chosenModel = modelSel ? modelSel.value : null;

                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        conversation_id: currentConversationId,
                        message: text,
                        mode: currentMode,
                        model: chosenModel
                    })
                });

                removeTypingIndicator();

                if (res.ok) {
                    const data = await res.json();
                    appendMessageToUI(
                        "assistant", 
                        data.answer, 
                        new Date().toISOString(), 
                        data.retrieved_memories, 
                        data.extracted_memory
                    );

                    // Update title in sidebar if it's the first message
                    const conv = conversations.find(c => c.id === currentConversationId);
                    if (conv) {
                        conv.message_count = (conv.message_count || 0) + 2;
                        if (conv.title === "New Conversation") {
                            conv.title = text.slice(0, 36) + (text.length > 36 ? '...' : '');
                            document.getElementById("chat-title").innerText = conv.title;
                        }
                        renderConversationsList();
                    }
                } else {
                    const err = await res.json();
                    appendMessageToUI("assistant", `[Error: ${err.error || "Unable to generate response"}]`, new Date().toISOString());
                }
            } catch (err) {
                removeTypingIndicator();
                appendMessageToUI("assistant", `[Network Error: ${err.message}]`, new Date().toISOString());
            } finally {
                isGenerating = false;
                document.getElementById("btn-send").disabled = false;
                textarea.focus();
            }
        }

        function showTypingIndicator() {
            const container = document.getElementById("messages-container");
            const typingRow = document.createElement("div");
            typingRow.className = "message-row assistant";
            typingRow.id = "typing-row";
            typingRow.innerHTML = `
                <div class="avatar">◈</div>
                <div class="message-content-wrapper">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            container.appendChild(typingRow);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const row = document.getElementById("typing-row");
            if (row) row.remove();
        }

        // ═══════════════ UTILITIES ═══════════════
        function autoResizeTextarea(textarea) {
            textarea.style.height = "auto";
            textarea.style.height = Math.min(textarea.scrollHeight, 180) + "px";
        }

        function handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById("messages-container");
            container.scrollTop = container.scrollHeight;
        }

        function copyMessageText(btn, text) {
            navigator.clipboard.writeText(text);
            const orig = btn.innerText;
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = orig, 2000);
        }

        function showToast(message) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeForAttribute(str) {
            if (!str) return "";
            return str
                .replace(/'/g, "\\'")
                .replace(/"/g, "&quot;")
                .replace(/\n/g, "\\n");
        }
    </script>
</body>
</html>
